<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2330;--mut:#6b7385;--pri:#3b5bdb;--ok:#2f9e44;--okbg:#e6f7ea;--bad:#e03131;--badbg:#fdeaea;--bd:#dfe3ec}
@media(prefers-color-scheme:dark){:root{--bg:#14171f;--card:#1e222d;--tx:#e8ebf2;--mut:#98a1b5;--pri:#748ffc;--ok:#51cf66;--okbg:#1c3324;--bad:#ff6b6b;--badbg:#3a2022;--bd:#313748}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 4px}h2{font-size:20px;margin:0 0 12px}
.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 14px}
button:hover{border-color:var(--pri)}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button:disabled{opacity:.5;cursor:default}
.chbtn{text-align:left;padding:14px}.chbtn b{display:block}.chbtn span{color:var(--mut);font-size:14px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
@media(max-width:600px){.modes{grid-template-columns:1fr}}
.mode{padding:18px;text-align:left}.mode b{font-size:18px;display:block;margin-bottom:4px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--pri)}
.tag{display:inline-block;font-size:13px;color:var(--mut);margin-bottom:6px}
.q{font-size:18px;font-weight:600;margin:0 0 14px;white-space:pre-line}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px 14px}
.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,var(--card))}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:8px;padding:10px 14px;border-radius:10px;font-weight:600}.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
.pal{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.pal button{width:36px;height:34px;padding:0;font-size:13px}
.pal button.done{background:color-mix(in srgb,var(--pri) 18%,var(--card));border-color:var(--pri)}
.pal button.cur{outline:2px solid var(--pri)}
.pal button.ok{background:var(--okbg);border-color:var(--ok)}.pal button.bad{background:var(--badbg);border-color:var(--bad)}
.score{font-size:44px;font-weight:700;margin:4px 0}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
label.chk{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:15px}
</style>
</head>

const NAMES=["Chương 1 – Tổng quan E-commerce","Chương 2 – Mô hình kinh doanh","Chương 3 – Hạ tầng Internet & Web","Chương 4 – Xây dựng website","Chương 5 – Bảo mật & thanh toán","Chương 6 – Marketing & quảng cáo"];
const CH = RAW.map((c,ci)=>c.map((r,i)=>r.length==2
  ?{ch:ci,id:ci+'-'+i,q:r[0],o:["True (Đúng)","False (Sai)"],a:r[1]=="T"?0:1}
  :{ch:ci,id:ci+'-'+i,q:r[0],o:r.slice(1,5),a:"ABCD".indexOf(r[5])}));

const $=s=>document.querySelector(s), app=$('#app');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const L="ABCD";
let S={};

function home(){
  clearInterval(S.timer);S={};
  app.innerHTML=`<h1>📚 E-commerce Quiz</h1><p class="sub">Ngân hàng ${CH.reduce((n,c)=>n+c.length,0)} câu hỏi · 6 chương</p>
  <div class="modes">
    <button class="card mode" onclick="studyMenu()"><b>📖 Chế độ học</b>Học theo từng chương, xem đáp án đúng/sai ngay sau mỗi câu.</button>
    <button class="card mode" onclick="startTest()"><b>📝 Chế độ kiểm tra</b>60 câu: mỗi chương 10 câu ngẫu nhiên. Nộp bài mới biết kết quả.</button>
  </div>`;
}
function studyMenu(){
  app.innerHTML=`<div class="top"><h2>Chọn chương để học</h2><button onclick="home()">← Trang chủ</button></div>
  <div class="card"><label class="chk"><input type="checkbox" id="shuf" checked> Trộn thứ tự câu hỏi</label></div>
  <div class="grid">${CH.map((c,i)=>`<button class="card chbtn" onclick="startStudy(${i})"><b>${NAMES[i]}</b><span>${c.length} câu</span></button>`).join('')}</div>`;
}
function startStudy(ci,customList){
  const shuf=$('#shuf')?$('#shuf').checked:true;
  S={mode:'study',ci,list:customList||(shuf?shuffle(CH[ci]):CH[ci].slice()),i:0,ans:[],wrong:[]};
  render();
}
function startTest(){
  S={mode:'test',list:CH.flatMap(c=>shuffle(c).slice(0,10)),i:0,ans:[],t0:Date.now()};
  S.timer=setInterval(()=>{const e=$('#clock');if(e)e.textContent=fmt((Date.now()-S.t0)/1000|0)},1000);
  render();
}
const fmt=s=>String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

function render(){
  const q=S.list[S.i],n=S.list.length,test=S.mode=='test',chosen=S.ans[S.i],locked=!test&&chosen!=null;
  const title=test?`📝 Kiểm tra · ${NAMES[q.ch].split(' – ')[0]}`:`📖 ${NAMES[S.ci]}`;
  let h=`<div class="top"><b>${title}</b><span>${test?`⏱ <span id="clock">${fmt((Date.now()-S.t0)/1000|0)}</span> · `:''}Câu ${S.i+1}/${n}</span></div>
  <div class="bar"><i style="width:${(S.i+1)/n*100}%"></i></div><div class="card">
  <div class="tag">${q.o.length==2?'Đúng / Sai':'Trắc nghiệm'}</div><p class="q">${esc(q.q)}</p>`;
  q.o.forEach((o,k)=>{
    let cls='opt';
    if(locked){if(k==q.a)cls+=' ok';else if(k==chosen)cls+=' bad'}
    else if(chosen==k)cls+=' sel';
    h+=`<button class="${cls}" ${locked?'disabled':''} onclick="pick(${k})">${q.o.length==4?`<b>${L[k]}.</b> `:''}${esc(o)}</button>`;
  });
  if(locked)h+=chosen==q.a?`<div class="fb ok">✔ Chính xác!</div>`:`<div class="fb bad">✘ Sai. Đáp án đúng: ${q.o.length==4?L[q.a]+'. ':''}${esc(q.o[q.a])}</div>`;
  h+=`</div><div class="nav"><button onclick="go(-1)" ${S.i==0?'disabled':''}>← Trước</button>`;
  if(test)h+=`<button class="pri" onclick="submit()">Nộp bài (${S.ans.filter(x=>x!=null).length}/${n})</button>`;
  else if(S.i==n-1)h+=`<button class="pri" onclick="finishStudy()">Hoàn thành</button>`;
  h+=`<button onclick="go(1)" ${S.i==n-1?'disabled':''}>Tiếp →</button></div>`;
  if(test){h+=`<div class="card"><div class="tag">Bảng câu hỏi</div><div class="pal">${S.list.map((_,k)=>`<button class="${S.ans[k]!=null?'done':''} ${k==S.i?'cur':''}" onclick="S.i=${k};render()">${k+1}</button>`).join('')}</div></div>
  <div class="row"><button onclick="if(confirm('Thoát bài kiểm tra?'))home()">Thoát</button></div>`}
  else h+=`<div class="row"><button onclick="studyMenu()">← Đổi chương</button></div>`;
  app.innerHTML=h;scrollTo(0,0);
}
function pick(k){
  const q=S.list[S.i];
  if(S.mode=='study'&&S.ans[S.i]!=null)return;
  S.ans[S.i]=k;
  render();
  if(S.mode=='test'&&S.i<S.list.length-1){/* giữ nguyên câu, người dùng tự bấm Tiếp */}
}
function go(d){S.i=Math.max(0,Math.min(S.list.length-1,S.i+d));render()}

function finishStudy(){
  const n=S.list.length,ok=S.list.filter((q,i)=>S.ans[i]==q.a).length,un=S.ans.filter(x=>x!=null).length;
  const wrong=S.list.filter((q,i)=>S.ans[i]!=null&&S.ans[i]!=q.a);
  app.innerHTML=`<div class="card"><h2>${NAMES[S.ci]}</h2><div class="score">${ok}/${n}</div>
  <p class="sub">Đã làm ${un}/${n} câu · Đúng ${ok} · Sai ${wrong.length}</p>
  <div class="row">${wrong.length?`<button class="pri" onclick="startStudy(${S.ci},shuffle(S.wrongList))">Luyện lại ${wrong.length} câu sai</button>`:''}
  <button onclick="startStudy(${S.ci})">Học lại chương</button><button onclick="studyMenu()">Chọn chương khác</button><button onclick="home()">Trang chủ</button></div></div>`;
  S.wrongList=wrong;
}

function submit(){
  const un=S.list.length-S.ans.filter(x=>x!=null).length;
  if(un&&!confirm(`Còn ${un} câu chưa làm. Vẫn nộp bài?`))return;
  clearInterval(S.timer);S.time=(Date.now()-S.t0)/1000|0;result();
}
function result(filter='all'){
  const n=S.list.length,ok=S.list.filter((q,i)=>S.ans[i]==q.a).length;
  const per=NAMES.map((nm,c)=>{const idx=S.list.map((q,i)=>q.ch==c?i:-1).filter(i=>i>=0);return [nm,idx.filter(i=>S.ans[i]==S.list[i].a).length,idx.length]});
  let h=`<div class="card"><h2>Kết quả kiểm tra</h2><div class="score">${ok}/${n} <small style="font-size:20px;color:var(--mut)">(${Math.round(ok/n*100)}%)</small></div>
  <p class="sub">Thời gian: ${fmt(S.time)}</p>
  <table>${per.map(p=>`<tr><td>${p[0]}</td><td><b>${p[1]}/${p[2]}</b></td></tr>`).join('')}</table>
  <div class="row"><button class="pri" onclick="startTest()">Làm đề mới</button><button onclick="home()">Trang chủ</button></div></div>
  <div class="card"><div class="tag">Bảng kết quả (bấm để xem câu)</div><div class="pal">${S.list.map((q,i)=>`<button class="${S.ans[i]==q.a?'ok':'bad'}" onclick="document.getElementById('r${i}').scrollIntoView({behavior:'smooth'})">${i+1}</button>`).join('')}</div>
  <div class="row"><button onclick="result('all')">Tất cả</button><button onclick="result('wrong')">Chỉ câu sai</button></div></div>`;
  S.list.forEach((q,i)=>{
    const good=S.ans[i]==q.a;if(filter=='wrong'&&good)return;
    h+=`<div class="card" id="r${i}"><div class="tag">Câu ${i+1} · ${NAMES[q.ch].split(' – ')[0]} · ${good?'✔ Đúng':S.ans[i]==null?'✘ Bỏ trống':'✘ Sai'}</div><p class="q">${esc(q.q)}</p>`+
    q.o.map((o,k)=>`<div class="opt ${k==q.a?'ok':k==S.ans[i]?'bad':''}">${q.o.length==4?`<b>${L[k]}.</b> `:''}${esc(o)}${k==q.a?' ✔':k==S.ans[i]?' ✘ (bạn chọn)':''}</div>`).join('')+`</div>`;
  });
  app.innerHTML=h;scrollTo(0,0);
}
home();
</script>
